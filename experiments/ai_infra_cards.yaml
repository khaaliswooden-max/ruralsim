# Experiment cards for the AI-infrastructure screening engine (tools/engines/ai_infra, D-101).
# Same schema as experiments/experiment_card_schema.yaml, plus the engine's scenario block.
# Cards are immutable once run; a changed experiment is a new card with `supersedes` set.

- id: EXP-0011
  supersedes: EXP-0007
  title: "20 MW data center at a rural county site, engine v1 (power flow + rate impact)"
  category: energy_compute
  hypothesis: >
    A 20 MW (IT) compute site at the county centroid can be connected without N-0 thermal or
    voltage violations, and without raising lowest-quintile residential rates by more than 2
    percent for any utility serving the county under any cost allocation, if paired with 30 MW
    of on-site solar and 60 MWh of storage, but not otherwise.
  counties: ["01131", "20019", "54047", "31173"]   # Wilcox AL (EXP-0007's county), then three
                                                     # nonmetro pilots; none is a back-test site
  site: {rule: centroid, note: "county centroid; moved off tribal land if it falls inside (siting constraint)"}
  intervention:
    description: two builds, grid-only versus grid plus on-site solar and storage; three cost allocations each
    parameters: {it_load_mw: 20, solar_mw: 30, storage_mwh: 60}
    parameter_sources: {it_load_mw: hypothetical (EXP-0007), solar_mw: hypothetical (EXP-0007), storage_mwh: hypothetical (EXP-0007),
                        everything else: "tools/engines/ai_infra/params/assumed.yaml (assumed, sampled) and EIA-861/OSM (observed)"}
  scenarios:
    - {name: grid_only, it_load_mw: 20}
    - {name: with_onsite, it_load_mw: 20, onsite: {solar_mw: 30, storage_mwh: 60}}
  baseline: same network and county load without the site, same seed
  duration: "one peak hour (N-0 power flow) and one year (rates)"
  time_step: "steady state"
  engines: [power, economy]
  seeds: 20
  metrics:
    primary: lowest_quintile_rate_change_pct (percent), per candidate utility and cost allocation
    secondary: [voltage_violations_n0, thermal_overloads_n0, required_upgrades, new_line_km, interconnection_voltage_class_kv,
                lowest_quintile_energy_cost_share_change_pp]
    rqli_domains_affected: [cost_burden, power_reliability]
  criterion:                      # stated before the run (D-101)
    grid_clean_seed_share: 0.9    # no voltage and no thermal violation in at least 90% of seeds
    rate_change_pct_max: 2.0      # p50 across seeds, for every candidate utility with data, every allocation
    rule: >
      Supported for a county and scenario only if the grid criterion holds and every candidate
      utility passes under every allocation. A candidate without EIA-861 sales is indeterminate,
      which is not a pass.
  success_criterion: "with_onsite passes and grid_only fails, per the criterion block, in Wilcox AL"
  fidelity_tier: B_pilot_3d
  provenance_floor: assumed
  risks_to_residents: "rate shifting onto small co-op memberships; few permanent jobs; land use"

- id: EXP-0012
  title: "Cooling water for a 20 MW data center at a rural county site, three cooling designs"
  category: energy_compute
  hypothesis: >
    A 20 MW (IT) compute site at the county centroid can be cooled without its peak-day
    withdrawal exceeding 10 percent of the dry-season low flow of the largest gauged stream
    within 50 km, and without its annual withdrawal exceeding 10 percent of the county's
    public-supply withdrawals, with evaporative cooling; adiabatic hybrid and dry cooling
    pass both with margin.
  counties: ["01131", "20019", "54047", "31173"]
  site: {rule: centroid, note: "same site rule as EXP-0011"}
  modules: [cooling_water]
  intervention:
    description: one 20 MW IT site, three cooling designs
    parameters: {it_load_mw: 20}
    parameter_sources: {it_load_mw: hypothetical (EXP-0007), everything else: "params/assumed.yaml cooling block (assumed, sampled); NASA POWER, USGS 2015 water use, NWIS gauges, SDWIS (observed)"}
  scenarios:
    - {name: evaporative, it_load_mw: 20, cooling: evaporative}
    - {name: adiabatic_hybrid, it_load_mw: 20, cooling: adiabatic_hybrid}
    - {name: dry, it_load_mw: 20, cooling: dry}
  baseline: the county's 2015 water use and the gauge's day-of-year flow statistics, without the site
  duration: "30 years of daily weather (1991-2020)"
  time_step: "1 day"
  engines: [water_environment]
  seeds: 20
  metrics:
    primary: annual_withdrawal_m3 (m3 per year), per cooling design
    secondary: [peak_day_withdrawal_m3, share_of_source_low_flow_peak_day, share_of_county_public_supply,
                share_of_county_fresh_withdrawals, wue_l_per_it_kwh, pue_effective_annual]
    rqli_domains_affected: [environment]
  criterion:                       # stated before the run (D-106); screening bars, assumed
    peak_day_share_of_low_flow_max: 0.10     # p50 peak-day withdrawal / source gauge p10_min flow
    annual_share_of_public_supply_max: 0.10  # p50 annual-average withdrawal / county public supply, 2015
    source_rule: "largest-drainage gauge with low-flow statistics within 50 km of the site; nearest gauge reported, not scored"
    rule: "A design passes in a county only if both bars hold. water_within_recharge is always indeterminate (no modelled sustainable yield)."
  success_criterion: "evaporative passes both bars in Wilcox AL; adiabatic_hybrid and dry pass both everywhere a source gauge exists"
  fidelity_tier: B_pilot_3d
  provenance_floor: assumed
  risks_to_residents: "competition with household and farm supply in dry seasons; the source river may be far from the site"

- id: EXP-0013
  title: "Flood screen for a 20 MW data center at a rural county site"
  category: energy_compute
  hypothesis: >
    A 20 MW compute site at the county centroid lies outside FEMA's 1% annual-chance flood
    zone (SFHA), with no more than 10 percent of its footprint inside it, in every county with
    a digital flood map.
  counties: ["01131", "20019", "54047", "31173"]
  site: {rule: centroid, note: "same site rule as EXP-0011 and EXP-0012"}
  modules: [flood]
  intervention:
    description: one site footprint, a square around the site point
    parameters: {footprint_area_ha: "8-25 (assumed, drawn per seed)"}
    parameter_sources: {footprint_area_ha: assumed, zones: "FEMA NFHL effective, pulled 2026-11-22 (D-057)"}
  scenarios:
    - {name: site, it_load_mw: 20}
  baseline: the effective FEMA flood map; no change to the land
  duration: "static map"
  time_step: "n/a"
  engines: [water_environment]
  seeds: 20
  metrics:
    primary: footprint_share_sfha (fraction of footprint in the 1% annual-chance zone)
    secondary: [site_point_zone, footprint_share_x_shaded, footprint_share_zone_d, distance_to_sfha_m]
    rqli_domains_affected: [environment]
  criterion:                      # stated before the run (D-107); screening bar, assumed
    footprint_share_sfha_max: 0.10
    rule: >
      Pass only if the site point is outside the SFHA and the p50 footprint share in the SFHA
      is at most 10 percent. A county with no digital FIRM is indeterminate, never a pass. A
      pending or preliminary map is flagged on the result; it does not change pass or fail.
  success_criterion: "passes in every county whose map status is effective"
  fidelity_tier: B_pilot_3d
  provenance_floor: assumed
  risks_to_residents: "a flooded site can lose power or water service it shares with residents; fill in a floodplain can move water onto neighbours"
