# National EIA-860 / EIA-861 tables (D-051) and ACS income quintiles (D-053) in R2 for the
# AI-infrastructure engine.
# Run once per EIA release from the Actions tab: "Mirror EIA tables" -> Run workflow.
# Writes eia/<year>/ and acs/<year>/ (parquet + _meta.json); county builds are unchanged.
name: Mirror EIA and ACS tables

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Build and upload the tables
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ruralsim-data
          RURALSIM_CACHE: ${{ runner.temp }}/cache
          PYTHONUNBUFFERED: "1"
        run: |
          python tools/mirror_eia.py
          python tools/mirror_acs.py
