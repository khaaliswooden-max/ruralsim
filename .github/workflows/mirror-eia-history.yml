# EIA-860/861 tables of past years for the back-test's T0-1 rule (D-062).
# Manual: Actions -> "Mirror EIA history" -> Run workflow.
name: Mirror EIA history

on:
  workflow_dispatch:
    inputs:
      years:
        description: "Space-separated years (back-test T0-1: Wasco 2004, Grant 2005, Mayes 2006, Morrow 2007, Crook and Rutherford 2009, Jackson 2014)"
        default: "2004 2005 2006 2007 2009 2014"

permissions:
  contents: read

jobs:
  history:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: EIA-860/861 for ${{ inputs.years }}
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ruralsim-data
          PYTHONUNBUFFERED: "1"
        run: python tools/mirror_eia_history.py --year ${{ inputs.years }}
