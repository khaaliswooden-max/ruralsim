# Cooling-water inputs for the AI-infrastructure engine (D-054): NASA POWER daily wet-bulb
# per county (LR-3) and the national EPA SDWIS water-system table (LR-5), into R2.
# Manual: Actions -> "Mirror cooling-water inputs" -> Run workflow. Resumable: counties
# already in R2 are skipped, so a rerun picks up where an interrupted one stopped.
name: Mirror cooling-water inputs

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Refetch counties already in R2 (wet-bulb)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  wetbulb:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: NASA POWER daily wet-bulb, all counties
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ruralsim-data
          PYTHONUNBUFFERED: "1"
        run: python tools/mirror_power.py ${{ inputs.force && '--force' || '' }}
  sdwis:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: EPA SDWIS water systems, national
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ruralsim-data
          PYTHONUNBUFFERED: "1"
        run: python tools/mirror_sdwis.py
