# FEMA flood zones clipped to every county, with each county's FIRM status (D-057, LR-8).
# Manual: Actions -> "Mirror FEMA flood zones" -> Run workflow. One job per state, a few
# at a time (FEMA's server is shared); a rerun skips counties already in R2.
name: Mirror FEMA flood zones

on:
  workflow_dispatch:
    inputs:
      states:
        description: "Space-separated state codes, or 'all'"
        default: "all"
      max_parallel:
        description: "State jobs at once (each uses one of the account's 20 job slots)"
        default: "6"

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      states: ${{ steps.s.outputs.states }}
    steps:
      - id: s
        run: |
          ALL="AL AK AZ AR CA CO CT DE DC FL GA HI ID IL IN IA KS KY LA ME MD MA MI MN MS MO MT NE NV NH NJ NM NY NC ND OH OK OR PA RI SC SD TN TX UT VT VA WA WV WI WY"
          IN="${{ inputs.states }}"; [ "$IN" = "all" ] && IN="$ALL"
          echo "states=$(printf '%s\n' $IN | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"
  state:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(inputs.max_parallel) }}
      matrix:
        state: ${{ fromJSON(needs.plan.outputs.states) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Flood zones, ${{ matrix.state }}
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ruralsim-data
          PYTHONUNBUFFERED: "1"
        run: python tools/mirror_nfhl.py --state ${{ matrix.state }}
  summarize:
    needs: state
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: County status table
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ruralsim-data
          PYTHONUNBUFFERED: "1"
        run: python tools/mirror_nfhl.py --summarize
