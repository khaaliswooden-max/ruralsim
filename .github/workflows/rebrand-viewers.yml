# Replace the founder disclosure line in county viewers already published to R2 (D-048).
# Manual: Actions -> "Rebrand published viewers" -> Run workflow. Leave "dry run" ticked first
# to see the counts, then run again with it unticked. Safe to repeat.
name: Rebrand published viewers

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Report what would change without writing"
        type: boolean
        default: true
      fips:
        description: "Only these county FIPS codes, space-separated (blank = all published)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  rebrand:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install boto3
      - name: Rewrite current/viewer/index.html
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ruralsim-data
          PYTHONUNBUFFERED: "1"
        run: |
          python tools/rebrand_viewers.py ${{ inputs.dry_run && '--dry-run' || '' }} ${{ inputs.fips && format('--fips {0}', inputs.fips) || '' }}
