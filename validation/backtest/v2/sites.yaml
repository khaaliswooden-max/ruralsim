# Back-test v2 sites. Pre-registered 2026-11-22 (D-207). None was used in v1 (D-200..D-206).
#
# Same split as v1: `before:` is what the engine may read (with the site point, the mask
# terms and the design inputs of the conditional run); `observed:` is what happened, read
# only by the scorer. Source keys resolve in SITES.md. PENDING = must be filled from a dated
# primary source by an amendment merged before the first v2 run, else the comparison is
# NOT SCORED. Years: T0 = first public announcement; E = first year of operation; where
# sources disagree, every candidate E is listed and a comparison passes only if it passes
# for all of them.
#
# Load (fix 3, PREREGISTRATION §5.3): operator-disclosed site electricity for the year a
# comparison needs, where the operator publishes it per site; otherwise the serving
# utility's EIA-861 delivered-energy increment, only if detectable.

scored_sites:

  - id: V2-01
    fips5: "41013"
    county: Crook County, OR
    state: OR
    rucc: {"2003": 6, "2013": 6, "2023": 3}   # nonmetro in the vintage in force at T0 (2003) (§3.1)
    operator: Meta (Facebook)
    site: Prineville data center campus
    site_point: [-120.88562, 44.29732]        # mean of the 11 OSM buildings tagged operator Meta / Meta Platforms
                                              # (ways 321385147, 373945186, 592160495, 706759845, 772827597, 772827601,
                                              # 1152747559, 1152748037, 1230289118, 1230289120, 1460426704);
                                              # Apple's campus (~1 km east) is not in the site
                                              # world 41013_crook_or snapshot 20261122T224804Z-4b80cd1
    mask_owner_terms: [Meta, Facebook]
    mask_keep_osm_ids: []                     # OSM had no substation mapped in the county before 2016 (ohsome, §4.2)
    T0: 2010              # announced 2010-01-21 [CR-1]
    E: [2011]             # 71 GWh used in 2011 [CR-4]; opened April 2011 [CR-2]
    serving_utility: {name: PacifiCorp (Pacific Power), eia_id: 14354, ownership: investor_owned, source: [CR-3]}
    load:
      operator_disclosed_mwh: {2011: 71000, 2012: 153000, 2013: 224000, 2014: 262000, 2015: 284000,
                               2016: 327000, 2017: 426000, 2018: 488000, 2019: 573000, 2020: 686000}
      operator_source: [CR-4, CR-5]
      eia_utility: null                       # PacifiCorp's Oregon sales are too large to show the site (§5.3)
    cooling: adiabatic_hybrid                 # outside air through an evaporative "mister" wall; no cooling towers
                                              # or chillers [CR-6]; mapped by design (§5.4), not by water figures
    before:
      announced_investment_usd: null          # not disclosed at T0 [CR-1]
      announced_jobs: 35                      # permanent, plus ~200 construction [CR-1]
      announced_mw: null
    observed:
      G1_grid_build: {new_substation: true, new_line_ge_69kv: null,
                      detail: "BPA and Pacific Power completed the Ponderosa substation upgrade (+350 MW to the local grid) in January 2013, which BPA had planned for 2014; in October 2010 the local BPA substation lacked capacity for Facebook's planned buildings",
                      source: [CR-3, CR-7]}
      R1_rate_utility: {eia_id: 14354, name: PacifiCorp}
      W1_water:                               # withdrawal, the site's own disclosure [CR-4, CR-5]
        - {year: 2014, m3: 41639, note: "11,000,000 gal"}
        - {year: 2015, m3: 68137, note: "18,000,000 gal"}
        - {year: 2016, m3: 70000}
        - {year: 2017, m3: 172000}
        - {year: 2018, m3: 160000}
        - {year: 2019, m3: 208000}
        - {year: 2020, m3: 445000}

