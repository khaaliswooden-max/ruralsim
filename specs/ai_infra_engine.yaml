# AI-infrastructure screening engine — specification v0.1 (DRAFT, D-100)
# Rollout step 2. Spec only: no engine code lands with this file.
#
# Screens one proposed compute site in one built county across five modules:
# power flow, rate impact, cooling water, fiber, flood. Reads published county
# layers (R2 snapshots) plus external public sources listed below. Every result is
# graded SPECULATIVE: screening-grade, reduced-order, assumed parameters.
# Decision support, not a finding.

version: "0.2-draft"
status: draft          # draft -> accepted (on merge) -> superseded
decision: D-100
amended_by: [D-111]    # D-111: proposal-card intake, options with no-build, not_modelled block; applies D-420 and D-430
engine_module: tools/engines/ai_infra/     # planned location; not created by this PR
reads_from: "R2 public snapshot: worlds/<dir>/snapshots/<snapshot>/ (manifest.json pins sha256 per file)"
target_population: "nonmetro counties (RUCC 2023 4-9; 1,958 counties). Metro counties run only as contrast cases."
grade: SPECULATIVE     # fixed for every public run; see grading below

# ---------------------------------------------------------------------------
# Rules the engine enforces in code, not by convention
# ---------------------------------------------------------------------------
rules:
  provenance_vocabulary: [observed, derived, calibrated, assumed, hypothetical]   # ARCHITECTURE §4
  every_input_tagged: "each input carries value, unit, provenance, source, and for assumed inputs a sensitivity range"
  assumed_inputs_are_sampled: >
    every assumed input is drawn per seed from its stated range (uniform unless a
    distribution is given). EXP-0007 v0 used fixed values and ignored the seed, so its
    20 seeds returned one number with a zero-width 90% interval; that must not recur.
  seeds: {screening_min: 5, promotable_min: 20}
  misses_first: "the output lists every failed or indeterminate criterion before any passing one"
  indeterminate_is_not_pass: "a criterion the engine cannot evaluate is reported indeterminate, never passed"
  blocked_modules_say_so: "a module without its required inputs returns status blocked with the missing input named; it is never approximated silently"
  no_tuning_on_backtest_sites: >
    no parameter may be fitted, adjusted or chosen by looking at observed outcomes in any
    county on step 3's candidate list (validation/backtest/). Engine development uses
    other nonmetro counties.
  backtest_gate: >
    the runner refuses a site listed in validation/backtest/PREREGISTRATION.md unless that
    file is merged on main and its pass bars cover every output the run would be compared on.
  guardrails: >
    synthetic households only (tools/harness/households.py); no address-level records;
    political variables denylisted (D-007); no option relocates residents; tribal land
    is a siting constraint, not an input to optimise over.
  no_workflow_on_push: "batch runs are manual; heavy batches run between county-build batches (20 shared Actions jobs)"
  # --- D-111 -------------------------------------------------------------------
  run_kinds: >
    every run declares run_kind: experiment_card (EXP-*, RuralSim's own questions),
    proposal_card (PC-*, a question brought by a county, a resident or anyone else), or
    backtest (BT-*, under validation/backtest/PREREGISTRATION.md). The engine, its
    parameters and its outputs are the same for all three; only the intake differs.
  options_always_include_no_build: >
    a proposal_card run screens at least two options, and one of them is always
    no_build. A card without no_build is refused, never patched silently. no_build is
    the county as it stands (same seed, same network, same county load, no site); it is
    screened and reported like any other option, including its own misses and its own
    not_modelled entries, so that it is never presented as the costless default.
  options_are_the_submitters: >
    RuralSim does not add a build option the submitter did not ask for. The intake may
    suggest standard alternatives (smaller or first phase only, other cooling, other
    site, with conditions); each runs only if the submitter ticks it. no_build is the
    one option added by rule.
  not_modelled_always: >
    every run record, every summary, every county brief and every viewer panel that
    shows a result carries the not_modelled block in full (output_schema.not_modelled).
    The fixed core list cannot be shortened by a card, a client or a layout. A record
    without it fails validation and is not written to the ledger.
  site_public_geography_only: >
    a proposal_card names its site only at public-geography level: an H3 resolution-8
    cell (about 0.74 km2), a 2020 Census block group, or a PLSS section. Never a street
    address, a parcel number or an owner name. A map click in the intake is converted to
    its H3 cell and the click is discarded. The engine runs at the cell centroid, and the
    record says so (site.resolution).
  proposal_sites_are_never_moved: >
    a proposal card's site is the submitter's, so it is never moved. A site outside the
    county is refused. A site that touches tribal land is refused under D-420 unless the
    card is a request from that nation's government (tribal_land rule below).
  tribal_land: >
    D-420. Tribal land = Census TIGER AIANNH CLASSFP D0, D2, D3, D5, D8 and Oklahoma Tribal
    Statistical Areas D6, including fee land inside reservation boundaries; Alaska Native
    village areas, Hawaiian Home Lands and state reservations are treated the same until
    decided. Without a request from the nation's government, no run of any kind places a
    site, an intervention or a modelled population on tribal land, and no output reports a
    score, subtotal or narrative claim about it. In a partly tribal county every run (1)
    masks tribal land from candidate sites (experiment cards: no site on tribal land;
    proposal cards: refusal), (2) masks tribal-land households from the synthetic
    population and from every lowest-quintile or worst-off output, and (3) reports
    utility-wide results that cannot be split by location with no figure for the tribal
    area. Every such record carries a not_modelled entry "tribal land masked (D-420)" naming
    the nation(s). A request from a county, state, utility, co-op, developer, researcher
    or client is not a nation's request. A card from a nation's government
    (submitter_role tribal_government, verified against the BIA Tribal Leaders Directory
    and the nation's own site before intake) runs on that nation's land only, and its
    results are governed by the nation's terms (record field publication: nation_terms),
    which override revenue Rule 3 and D-400; anything published keeps its true grade and
    both disclosure lines. Today the engine moves an experiment card's centroid site off
    tribal land (site_point()) and masks no population: population masking is new work.
  backtest_gate_applies_to_proposals: >
    gate.check() is unchanged. A proposal card in a back-test county or brief candidate
    (gate.BRIEF_CANDIDATES, validation/backtest/sites.yaml) is held, status
    held_backtest_gate, until the first back-test run is recorded and the
    pre-registration is frozen (PREREGISTRATION §8). It is then run as normal.
  params_untouched: >
    D-111 changes no value in params/assumed.yaml or params/activsg_distributions.json,
    so params_sha256 is unaffected. Two parts do change results and land before step 3's
    first back-test run (PREREGISTRATION §4.3 freezes the engine at that run, not before):
    D-420 population masking changes lowest-quintile and worst-off outputs in partly tribal
    counties, and D-420 refuses runs on tribal land. Affected EXP cards are rerun as new
    ledger records; old records stay as written.
  backtest_and_d420: >
    No carve-out for back-tests. Back-test site BT-01 (Mayes OK) lies entirely inside the
    Cherokee OTSA (CLASSFP D6); it is dropped by D-204 (sites.yaml refused, gate refuses,
    every BT-01 comparison NOT SCORED).

# ---------------------------------------------------------------------------
# Scenario: what a run screens
# ---------------------------------------------------------------------------
scenario_inputs:
  site:            {fields: [fips5, lon, lat], provenance: hypothetical, note: "a proposed point; never a real parcel owner's address"}
  it_load_mw:      {provenance: hypothetical, default: 20, note: "EXP-0007 value"}
  pue:             {provenance: assumed, default: 1.25, range: [1.1, 1.5]}
  load_factor:     {provenance: assumed, range: [0.7, 0.95], note: "facility average / peak"}
  ramp_years:      {provenance: assumed, range: [1, 5]}
  cooling_type:    {provenance: hypothetical, values: [dry, adiabatic_hybrid, evaporative]}
  onsite_generation: {provenance: hypothetical, fields: [solar_mw, storage_mwh, firm_mw], default: {solar_mw: 0, storage_mwh: 0, firm_mw: 0}}
  cost_allocation: {provenance: hypothetical, values: [direct_assignment, large_load_tariff, socialized],
                    note: "who pays for grid upgrades and on-site generation; run all three unless the card fixes one"}
  # --- D-111: fields a proposal card can set. Experiment and back-test cards
  # --- keep the fields above unchanged; these are optional and ignored when absent.
  site_resolution:  {provenance: hypothetical, values: [point, h3_r8, blockgroup_2020, plss_section],
                     note: "point is allowed for experiment and back-test cards only; proposal cards use one of the other three"}
  phases:           {provenance: hypothetical, fields: [phase, year_offset, it_load_mw_cumulative],
                     note: "each phase runs as its own variant at its cumulative load; steady state, no ramp dynamics"}
  water_source:     {provenance: hypothetical, values: [public_system, groundwater, surface_water, reclaimed, none_dry, unknown],
                     fields: [pwsid_or_name, stream_or_aquifer_name],
                     note: "selects which comparison cooling_water leads with; unknown runs every comparison"}
  cooling_type_unknown: {rule: "when a card says cooling is unknown, every cooling_type value is run and reported (as PREREGISTRATION §4.1 does)"}
  backup_generation: {provenance: hypothetical, fields: [mw, fuel], note: "recorded and listed under not_modelled (emissions, noise); no module reads it in v0.2"}
  local_setback_m:  {provenance: observed, note: "entered from the county's own ordinance if it has one; recorded and listed under not_modelled (setbacks) in v0.2"}

# ---------------------------------------------------------------------------
# Proposal-card intake (D-111). Template and fiscal checklist: specs/proposal_card.md
# ---------------------------------------------------------------------------
proposal_card_intake:
  card_id: "PC-<yyyy>-<nnnn>; immutable once run; a revision is a new card with supersedes:"
  compiles_to: >
    one engine card in the existing card format (experiments/ai_infra_cards.yaml shape):
    each option becomes one entry in scenarios[] with name = option_id; no_build becomes a
    scenario with it_load_mw 0 and no on-site generation, evaluated on the same seed
    streams as every other option (common random numbers, D-101 (5)).
  modules: "all five run for every proposal card; a module a card cannot feed is reported blocked or indeterminate, never dropped"
  criteria: >
    pass bars are fixed before the run. The submitter may accept RuralSim's default bars
    (the EXP-0011..0014 criterion blocks) or set its own; either way the bars, and who set
    them, are written into the card before it runs and cannot change after.
  stated_not_checked: >
    figures the submitter supplies that no module reads (announced investment, jobs, tax
    terms, construction schedule) are carried into the record under stated_not_checked,
    labelled "stated by the submitter, not checked by RuralSim", and never scored.
  grade: SPECULATIVE   # every proposal card; a proposal card is never a back-test
  refusals: [no no_build option, fewer than two options, address or parcel or owner given as site,
             site outside county, site touches tribal land and the card is not from that nation (D-420), political variable in an objective]
  holds: [held_backtest_gate]

# ---------------------------------------------------------------------------
# Modules
# ---------------------------------------------------------------------------
modules:

  power_flow:
    question: "Can the local grid serve the load, at which voltage, and what breaks?"
    method: >
      (1) Interconnection class: map facility peak MW to the minimum voltage class that
      could plausibly serve it (assumed thresholds, sampled). (2) Network graph: OSM lines
      and substations inside the county plus a buffer, snapped into buses by voltage class;
      boundary buses become slack/equivalent sources with assumed short-circuit strength.
      (3) DC power flow, N-0 thermal check, with line ratings and per-km impedances drawn
      from synthetic-grid distributions by voltage class. (4) Synthetic radial tap from the
      nearest substation of the required class to the site; AC voltage-drop check against
      ANSI C84.1 Range A. N-1 contingency is out of scope for v0.1 and reported indeterminate.
    solver: "pandapower (BSD-3) or OpenDSSDirect.py (BSD-3); chosen in the engine PR, licence checked there"
    inputs:
      - {name: line_geometry_and_voltage, provenance: observed, source: "OSM power=line/minor_line (layers_raw/osm/power.geojson)", coverage: "voltage tagged on 92-100% of in-county line km in the three inventoried counties"}
      - {name: substation_location_and_voltage, provenance: observed, source: "OSM power=substation", coverage: "voltage tagged on 93-100% (bbox)"}
      - {name: generating_plants, provenance: observed, source: "EIA-860 2024 Plant sheet (layers_raw/grid/)", gap: "no nameplate MW: needs Generator sheet (layer request LR-1)"}
      - {name: balancing_authority_and_nerc_region, provenance: observed, source: "EIA-860 Plant sheet"}
      - {name: line_rating_by_voltage_class, provenance: assumed, source: "distributions from Texas A&M ACTIVSg synthetic cases (ACTIVSg70k eastern US, ACTIVSg10k western US, ACTIVSg2000 Texas); 'free for commercial or non-commercial use', citation requested — licence to confirm in engine PR", note: "synthetic cases bear no relation to the real grid at their location; used only as parameter distributions, never as topology"}
      - {name: impedance_per_km_by_voltage_class, provenance: assumed, source: "same ACTIVSg distributions"}
      - {name: substation_transformer_capacity, provenance: assumed, source: "range by voltage class, ACTIVSg; OSM carries none"}
      - {name: existing_county_load, provenance: derived, source: "EIA-861 Sales_Ult_Cust 2024 MWh by serving utility, allocated to the county by customer share (LR-2); assumed load shape"}
      - {name: boundary_source_strength, provenance: assumed, source: "short-circuit MVA range by voltage class"}
      - {name: distribution_feeder_parameters, provenance: assumed, source: "NREL SMART-DS (CC BY 4.0; SFO, Greensboro, Austin regions) feeder statistics", note: "only used if the load falls in the distribution class; SMART-DS's rural coverage is unverified and must be checked before use"}
      - {name: interconnection_class_thresholds_mw, provenance: assumed, default: {distribution_12_35kv: "<= 10", subtransmission_46_69kv: "10-50", transmission_115_161kv: "50-300", transmission_230kv_plus: "> 300"}, note: "sampled with +/-30% on each boundary"}
    outputs:
      - {name: interconnection_voltage_class_kv, unit: kV}
      - {name: nearest_substation_of_class, fields: [osm_id, distance_km, voltage_kv]}
      - {name: new_line_km, unit: km, note: "radial tap length; 0 if the site is at the substation"}
      - {name: thermal_overloads_n0, unit: count, note: "lines/transformers above rating after the load is added"}
      - {name: max_loading_pct, unit: percent}
      - {name: voltage_violations_n0, unit: count, note: "buses outside 0.95-1.05 pu; replaces EXP-0007 'NOT MODELLED'"}
      - {name: min_voltage_pu, unit: pu}
      - {name: n1_contingency, value: indeterminate, note: "out of scope v0.1"}
      - {name: required_upgrades, fields: [type, kv, km_or_mva], note: "list; feeds rate_impact"}
    replaces_exp0007:
      - "voltage_violations: 'NOT MODELLED' -> voltage_violations_n0 from the tap + network solve"
      - "upgrade = 15e6 / 8e6 (lump capex, assumed) -> required_upgrades from the solve, priced in rate_impact"

  rate_impact:
    question: "What happens to rates and bills for the lowest-income households?"
    method: >
      For each utility that EIA-861 lists for the county (no territory polygons exist, so the
      serving utility is unknown and every candidate is run): price required_upgrades and any
      on-site generation with assumed unit costs; annualise with a sampled capital recovery
      factor; allocate by cost_allocation; net against margin on new sales; express as percent
      change in the utility's residential revenue requirement. Apply to synthetic lowest-quintile
      households (incomes calibrated per D-008) to get the rate change and the energy-cost share
      of income. Report the range across candidate utilities.
    inputs:
      - {name: candidate_utilities, provenance: observed, source: "EIA-861 2024 Service Territory (layers_raw/grid/eia861_territory_<fips>.csv)"}
      - {name: utility_ownership_type, provenance: observed, source: "EIA-861 Utility_Data 2024 (LR-2)", note: "co-op / municipal / IOU / public power; today read from names only"}
      - {name: residential_avg_rate_usd_per_kwh, provenance: observed, source: "EIA-861 Sales_Ult_Cust 2024: residential revenue / residential sales per utility-state (LR-2)", note: "average revenue, not a tariff"}
      - {name: residential_kwh_per_customer, provenance: observed, source: "EIA-861 Sales_Ult_Cust 2024: residential sales / customers (LR-2)"}
      - {name: residential_customers, provenance: observed, source: "EIA-861 Sales_Ult_Cust 2024 (LR-2)"}
      - {name: lowest_quintile_income, provenance: calibrated, source: "SAIPE median income + poverty, 90% CI sampled (households.py, D-008)"}
      - {name: lowest_quintile_kwh_share, provenance: assumed, range: [0.7, 1.0], note: "q1 use relative to the residential average"}
      - {name: unit_cost_line_per_km_by_kv, provenance: assumed, source: "public RTO cost-estimation guides (e.g. MISO Transmission Cost Estimation Guide) — to verify and cite in engine PR"}
      - {name: unit_cost_substation_by_kv, provenance: assumed, source: "same"}
      - {name: unit_cost_solar_storage_firm, provenance: assumed, source: "NREL Annual Technology Baseline (to verify licence)"}
      - {name: capital_recovery_factor, provenance: assumed, range: [0.06, 0.11]}
      - {name: margin_on_new_sales_share, provenance: assumed, range: [0.0, 0.25], note: "EXP-0007 v0 fixed this at 0.15"}
      - {name: wholesale_energy_and_capacity_cost, provenance: assumed, note: "co-ops buy power from a G&T; a large load can raise the G&T's capacity cost — modelled as a sampled pass-through"}
    outputs:
      - {name: lowest_quintile_rate_change_pct, unit: percent, fields: [p10, p50, p90], per: candidate_utility, note: "hard constraint protect_lowest_income_quintile: <= 2"}
      - {name: lowest_quintile_rate_change_pct_by_case, unit: percent, fields: [p10, p50, p90], per: candidate_utility, note: "only where EIA-861 transmission is blank (D-110): one band each for transmission_owner and distribution_only; the headline field is the upper end; the bar applies to both ends (D-113)"}
      - {name: lowest_quintile_energy_cost_share_change, unit: "percentage points of income"}
      - {name: worst_candidate_utility, note: "the utility with the highest p50 rate change"}
      - {name: local_tax_effect, value: not_modelled, note: "EXP-0007's metric includes local taxes; abatements are site-specific. Reported not_modelled, never 0"}
    replaces_exp0007:
      - "rate = 0.12 $/kWh (assumed) -> residential_avg_rate_usd_per_kwh (observed, EIA-861)"
      - "base_bill_kwh = 12,000 kWh/yr (assumed) -> residential_kwh_per_customer (observed, EIA-861)"
      - "county_hh = synthetic sample x 10 (assumed) -> residential_customers (observed, EIA-861)"
      - "upgrade capex 15e6 / 8e6 (assumed) -> priced required_upgrades from power_flow"
      - "solar 1.1e6 $/MW, storage 0.4e6 $/MWh (assumed, unsourced) -> sourced unit costs, sampled"
      - "CRF 8% fixed -> sampled range"
      - "15% of site revenue offsets rates, fixed -> sampled margin share"
      - "on-site generation capex charged to ratepayers implicitly -> explicit cost_allocation scenarios"

  cooling_water:
    question: "How much water would cooling draw, against what local supply?"
    method: >
      Annual and peak-day withdrawal from IT load, PUE and a water-use-effectiveness curve by
      cooling type driven by daily wet-bulb temperature. Compared against (a) existing county
      withdrawals by category, (b) community water systems whose service areas lie near the site,
      and (c) mean flow of the nearest named stream, where flow data exist.
    inputs:
      - {name: wet_bulb_daily, provenance: observed, source: "candidates: NASA POWER daily T2MWET (public, no key) or Open-Meteo daily dew point / RH (CC BY 4.0, rate-limited, D-050) — LR-3", gap: "no humidity in any published climate file"}
      - {name: drybulb_daily, provenance: observed, source: "layers_raw/climate/openmeteo_daily_1991_2020.csv (present in all three inventoried counties)"}
      - {name: wue_curve_by_cooling_type, provenance: assumed, source: "literature ranges, cited in engine PR", note: "dry cooling is ~0 water but raises PUE in heat; both effects sampled"}
      - {name: county_withdrawals_by_category, provenance: derived, source: "USGS modelled water use 2000-2020, HUC12 monthly (public supply, irrigation, thermoelectric; CC0) aggregated to county — LR-4", note: "USGS industrial 2020 county/HUC12 release also exists; verify"}
      - {name: community_water_systems_near_site, provenance: observed, source: "SDWIS + EPA service areas (layers_raw/water_systems/)", gap: "no capacity or population served in published files (LR-5)"}
      - {name: stream_mean_flow, provenance: derived, source: "NHDPlus HR value-added flow estimates or USGS NWIS gauges — LR-6", gap: "published NHD has no discharge"}
      - {name: power_plant_water_sources, provenance: observed, source: "EIA-860 'Name of Water Source'", note: "context: which rivers already supply thermal cooling"}
    outputs:
      - {name: annual_withdrawal_m3, unit: m3/yr, fields: [p10, p50, p90]}
      - {name: peak_day_withdrawal_m3, unit: m3/day}
      - {name: share_of_county_public_supply, unit: percent}
      - {name: share_of_nearest_stream_low_flow, unit: percent, note: "indeterminate until LR-6"}
      - {name: water_within_recharge, value: indeterminate, note: "rqli hard constraint needs a modelled sustainable yield; no public source identified. Reported indeterminate, never passed"}
    replaces_exp0007:
      - "water_m3_per_day: 0 (dry cooling, assumed) -> computed draw by cooling type, with dry cooling's PUE penalty"
      - "constraint water_within_recharge 'not modelled' (ledger) -> explicit indeterminate plus the shares above"

  fiber:
    question: "Is the site near fiber, and how many providers?"
    status_v0_1: active    # LR-7 delivered (D-058); implemented in D-108
    method: >
      From FCC Broadband Data Collection fixed availability, technology 50 (fiber to the premises),
      aggregated by RuralSim to H3 resolution-8 hexagons (~0.7 km2) and to counties: whether fiber is
      reported in the site's hexagon (point-in-H3), the centroid-to-centroid distance to the nearest
      hexagon with fiber_locations > 0 (hexagon-level, not a route distance), and the count of
      distinct fiber providers in the county. Deterministic: no sampled input.
      Middle-mile and long-haul routes are not in BDC and not public: reported not observed,
      indeterminate in every county (the planned Bernoulli stand-in was dropped; an assumed coin
      flip would read as information it is not).
    inputs:
      - {name: bdc_fiber_h3, provenance: observed, source: "broadband/bdc/<as_of>/fiber_h3.parquet (LR-7, D-058)", note: "provider-reported availability within 10 days; not subscriptions; challengeable. No location Fabric used"}
      - {name: bdc_fiber_county, provenance: observed, source: "broadband/bdc/<as_of>/fiber_county.parquet (LR-7, D-058)"}
      - {name: search_radius_km, provenance: assumed, source: "params/assumed.yaml fiber block (30 km)"}
    outputs:
      - {name: fiber_in_site_hex, unit: boolean}
      - {name: nearest_fiber_hex_km, unit: km, note: "0 when fiber is in the site hexagon; null when none within the search radius"}
      - {name: county_fiber_providers, unit: count}
      - {name: site_hex_max_down_mbps, unit: Mbps}
      - {name: middle_mile, value: "not observed"}
    replaces_exp0007: ["none — EXP-0007 had no network channel"]

  flood:
    question: "Is the site in a mapped flood hazard area?"
    method: "Point-in-polygon against FEMA NFHL flood zones; report zone and whether the county has a modernised effective FIRM."
    status_v0_1: active    # D-057 supersedes D-013 (layer delivered); implemented in D-107
    inputs_delivered: "flood/nfhl/county_status.parquet and flood/nfhl/zones/<fips5>.parquet (D-057)"
    status_rules: "none = no digital FIRM, never 'no flood risk' (indeterminate); partial = indeterminate unless the site is inside a drawn zone; prelim/pending coverage > 0 flags a map about to change"
    replaces_exp0007: ["none — EXP-0007 had no flood channel"]

# ---------------------------------------------------------------------------
# Output schema (one JSON record per run; ledger-compatible). To be agreed with step 3.
# ---------------------------------------------------------------------------
output_schema:
  record:
    run_id: string                       # <card or batch id>/<UTC time>
    run_kind: "experiment_card | proposal_card | backtest"                    # D-111
    proposal_card: "null, or {card_id, card_version, card_sha256, submitter_role, bars_set_by, pending_public_decision: bool}"   # D-111; role only, never a name. pending_public_decision per D-400's trigger, from the card's decision block
    publication: "default | nation_terms"   # D-111/D-420; nation_terms only for a card from a nation's government
    tribal_mask: "null, or {nations: [names], sites_masked: bool, population_masked: bool, households_removed: int}"   # D-111/D-420
    engine_version: string               # git commit of tools/engines/ai_infra
    spec_version: "0.2"
    grade: SPECULATIVE                   # fixed
    disclosure: "Simulated, screening-grade results with assumed parameters. Decision support, not a finding."
    county: {fips5: string, snapshot: string, manifest_sha256: string, rucc_2023: int}
    site: {lon: float, lat: float, enu_m: [x, y], resolution: "point | h3_r8 | blockgroup_2020 | plss_section", geography_id: "null or the cell/GEOID/section id"}   # D-111 adds the last two
    scenario: "scenario_inputs as run"
    options: >
      D-111. null for experiment and back-test runs. For proposal runs, a list of
      {option_id, label, is_no_build, scenario_name}; every scenario_name is a key of the
      existing per-county scenarios map, so the per-scenario output shape is unchanged.
    seeds: int
    provenance_floor: "weakest tag among inputs actually used"
    misses: "list of {module, criterion, threshold, value_or_status, option_id} for every failed or indeterminate criterion — printed first (option_id added by D-111; null outside proposal runs)"
    comparison: >
      D-111. null outside proposal runs. Per option and per output: p10/p50/p90, and the
      difference from no_build computed per seed and then summarised (never the
      difference of two medians). Ordered misses first within each option.
    not_modelled: >
      D-111. REQUIRED in every record, never empty. A list of
      {topic, status, why, who_can_answer, applies_to}; status is one of not_modelled,
      not_observed, indeterminate_every_run, blocked_this_run; applies_to is "all options"
      or a list of option_ids. Starts from the fixed core list below; modules append
      their own entries (blocked inputs, out-of-range validity, e.g. D-102's site-share limit).
      Replaces the flat not_modelled list run.py writes today; the old strings map onto core topics.
    stated_not_checked: "D-111. null, or the card's stated_not_checked block copied verbatim, labelled"
    fiscal_facts: >
      D-111/D-430. Required in every proposal_card record; null elsewhere until built for
      the county's state (Texas and Kansas first), and a null is itself listed under
      not_modelled. Provenance observed, no grade, no dollar estimate. Fields:
      taxing_units [{name, type, rate, rate_year, levy, levy_year, source}];
      state_taxes_business_personal_property {value, source};
      state_sales_tax_exemptions_for_data_centers [{statute, summary, source}];
      local_agreements_found [{type, parties, date, terms_as_recorded, source}] with the
      label "found in public registries; absence is not evidence there is none";
      questions_to_demand: the fixed checklist (specs/proposal_card.md), never edited per card.
      No revenue, incentive value, service cost or net figure is computed (D-430); a revenue
      screen (F2) needs a published fiscal back-test first, and F3 is never a free public screen.
    inputs: "list of {name, value_or_range, unit, provenance, source, sampled: bool}"
    modules:
      power_flow:    {status: "computed | indeterminate | blocked", reason: string, outputs: "see modules.power_flow.outputs, p10/p50/p90 where sampled"}
      rate_impact:   {status: ..., reason: ..., outputs: ...}
      cooling_water: {status: ..., reason: ..., outputs: ...}
      fiber:         {status: ..., reason: ..., outputs: ...}
      flood:         {status: ..., reason: ..., outputs: ...}
    hard_constraints: "rqli_spec.yaml ids -> {passed: true | false | indeterminate, note}"
    backtest: "null, or {site_id, preregistration_commit} when run under the backtest_gate"
  comparable_to_public_record:   # what step 3 can score against filings; step 3 sets the pass bars
    - {output: interconnection_voltage_class_kv, observed_counterpart: "voltage of the substation built or expanded for the site"}
    - {output: nearest_substation_of_class, observed_counterpart: "substation named in interconnection or transmission filings"}
    - {output: new_line_km, observed_counterpart: "new transmission line length in filings"}
    - {output: required_upgrades, observed_counterpart: "upgrade list in interconnection / transmission studies"}
    - {output: lowest_quintile_rate_change_pct, observed_counterpart: "residential rate change in a rate case tied to the load, where one exists"}
    - {output: annual_withdrawal_m3, observed_counterpart: "permitted or reported water volume"}
    - {output: timeline, observed_counterpart: "construction dates", note: "not modelled; step 3 should not score it against this engine"}
  # D-111 leaves this list, the output names in it and the backtest field unchanged.

  not_modelled_core:   # D-111. Printed in full on every output; a card cannot remove an entry.
    - {topic: "fiscal impact: revenue, incentives, service costs and school-finance offsets are not estimated",
       status: not_modelled, who_can_answer: "county appraisal district or assessor; state comptroller or revenue department; school district business office",
       note: "D-430 (F1): public tax facts and the questions to demand are reported in fiscal_facts; no dollar figure"}
    - {topic: noise (cooling plant, backup generators, substation), status: not_modelled, who_can_answer: "applicant's acoustic study; county noise ordinance"}
    - {topic: air emissions (backup generators, on-site combustion, grid-attributable), status: not_modelled, who_can_answer: "state air permit (generators); EPA eGRID for grid emissions"}
    - {topic: setbacks and distance to homes, schools and other buildings, status: not_modelled, who_can_answer: "county ordinance; site plan"}
    - {topic: appearance, height, lighting and viewshed, status: not_modelled, who_can_answer: "site plan and elevations; county planning staff"}
    - {topic: jobs, construction workforce, traffic and housing demand, status: not_modelled, who_can_answer: "applicant; any development agreement's job terms"}
    - {topic: construction timeline and phasing dynamics (phases are screened as steady states), status: not_modelled, who_can_answer: "applicant; utility interconnection queue"}
    - {topic: which utility serves the site, status: not_observed, why: "no public retail territory polygons; every candidate utility is run", who_can_answer: "the utilities; state commission territory maps"}
    - {topic: N-1 contingency and regional through-flow, status: not_modelled, who_can_answer: "utility or RTO interconnection study"}
    - {topic: middle-mile and long-haul fiber, status: not_observed, who_can_answer: "carriers; state broadband office"}
    - {topic: sustainable groundwater yield (water_within_recharge), status: indeterminate_every_run, who_can_answer: "groundwater conservation district; state water agency"}
    - {topic: nearby property values, land use change and other development of the same site under no_build, status: not_modelled, who_can_answer: "county appraisal district; planning staff"}
    - {topic: ecology, cultural and archaeological resources, status: not_modelled, who_can_answer: "state historic preservation office; tribal historic preservation officers; wildlife agencies"}
    - {topic: actual contract and tariff terms between the site and its utility, status: not_observed, who_can_answer: "the utility; state commission filings"}
  # Conditional entries appended by the run, never removed when they apply:
  #   tribal land masked (D-420), naming the nation(s), whenever tribal_mask is non-null;
  #   fiscal_facts not yet built for this state, whenever fiscal_facts is null.

