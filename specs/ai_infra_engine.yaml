# Layer requests for the step-1 chat (Khaalis carries these over)
# ---------------------------------------------------------------------------
layer_requests:
  - {id: LR-1, what: "EIA-860 Generator sheet: nameplate MW, technology, status per generator, joined to the county's plants", source: "eia8602024.zip (already cached, D-044)", license: "public domain (EIA)"}
  - {id: LR-2, what: "EIA-861 Utility_Data (ownership type) and Sales_Ult_Cust (residential revenue, MWh, customers) for each utility in the territory file", source: "f8612024.zip (already cached)", license: "public domain (EIA)", note: "also fixes the docstring/brief claim that co-ops are flagged"}
  - {id: LR-3, what: "daily wet-bulb or dew point 1991-2020 at the county centroid", source: "NASA POWER daily T2MWET (preferred: public, no key) or Open-Meteo dew_point_2m_mean added to the existing optional call", license: "NASA open data / CC BY 4.0"}
  - {id: LR-4, what: "USGS modelled water use 2000-2020 (public supply, irrigation, thermoelectric), HUC12 monthly, aggregated to county", source: "USGS data releases (e.g. doi:10.5066/P13VGWA3 lineage)", license: "CC0 / public domain"}
  - {id: LR-5, what: "SDWIS population_served_count, gw_sw_code, primary_source_code for active systems; and one consistent column set across counties (Pottawattamie publishes 44 empty columns, Wilcox/Licking 13)", source: "EPA Envirofacts WATER_SYSTEM", license: "public domain", note: "contact columns must stay out, per place_water_systems.py"}
  - {id: LR-6, what: "mean and low-flow estimates for NHD flowlines in the county", source: "NHDPlus HR value-added attributes, or USGS NWIS gauge statistics", license: "public domain"}
  - {id: LR-7, what: "FCC BDC fiber availability (technology 50) by H3 hexagon and provider count, per county", source: "FCC BDC public data downloads", license: "to verify; Fabric excluded"}
  - {id: LR-8, what: "FEMA NFHL flood zones clipped to the county, with FIRM status", source: "FEMA NFHL", license: "public domain", note: "retest reachability from Actions runners (D-013 was a sandbox block)"}
  - {id: LR-9, what: "check EIA-860 plant-to-county match: substring match on county name can over-match", source: "fetch_grid.py", license: "n/a"}
  - {id: LR-10, what: "EIA-861 short-form utilities (EIA-861S): residential revenue, MWh, customers and ownership, joined like Sales_Ult_Cust", source: "f8612024.zip Short_Form sheet (already cached)", license: "public domain (EIA)", note: "added by D-101: Pioneer Electric Coop (Wilcox AL) and Caney Valley El Coop (Chautauqua KS) are indeterminate without it"}
  - {id: LR-11, what: "ACS 5-year mean household income by quintile (B19081) and quintile upper limits (B19080), per county", source: "Census ACS", license: "public domain", note: "added by D-101: the SAIPE-calibrated lognormal shared with tools/harness/households.py gives an implausible lower tail in high-poverty counties"}
  - {id: LR-12, what: "Back-test population inputs (PREREGISTRATION §4.2.3, D-112): (a) Census county population estimates as published in vintages 2004, 2005, 2006 and 2014 (July 1 of each year, the vintage's own estimate, not the intercensal revision) at census/popest/v<vintage>/county.parquet with fips5, year, population; (b) Census 2000 and 2010 decennial population and households (occupied housing units) per county at census/decennial/<year>/households.parquet with fips5, population, households", source: "Census Bureau PEP archives (e.g. CO-EST2006-ALLDATA) and Census 2000/2010 SF1", license: "public domain", note: "2024 county FIPS; the four back-test counties have unchanged FIPS since 2000"}
  - {id: LR-13, what: "D-420 population masking (D-114): (a) 2020 Census population and households per county x AIANNH area, summed from blocks via the block-to-AIANNH assignment, at census/aiannh/2020/county_parts.parquet with fips5, aiannh_geoid, namelsad, classfp, population, households; (b) ACS 2020-2024 lowest-quintile mean household income (with MOE) for each partly tribal county outside tribal land, at acs/2024/income_quintiles_nontribal.parquet with fips5, mean_q1, mean_q1_moe, households, method", source: "Census 2020 DHC or PL 94-171 blocks and Block Assignment Files (AIANNH); ACS 5-year B19001 by block group", license: "public domain", note: "until (b) lands, a lowest-quintile income figure in a county with tribal land is masked, never computed with tribal-land households in it; 349 counties contain tribal land (D-420 draft)"}
  - {id: LR-14, what: "D-430 fiscal_facts for TX and KS (D-114): fiscal/<ST>/taxing_units.parquet (fips5, name, type, rate, rate_year, levy, levy_year, source) and fiscal/<ST>/local_agreements.parquet (fips5, type, parties, date, terms_as_recorded, source)", source: "Texas Comptroller tax rates and levies, Chapter 312 and JETI registries; Kansas Property Valuation Division levy data and Board of Tax Appeals exemption orders", license: "public domain", note: "state-level law is in tools/engines/ai_infra/reference/fiscal_state_facts.yaml, not a layer"}

